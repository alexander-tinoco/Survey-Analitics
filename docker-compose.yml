services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The web service waits on this, so "started" is not enough — an accepting
    # port does not mean the database is ready to answer queries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    # Bind-mounted so edits are picked up without a rebuild. Production builds
    # use the image contents instead.
    volumes:
      - .:/app
    # Host port is configurable so the stack does not collide with whatever
    # else is already listening locally. Container port stays fixed.
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    # Heavy analytics jobs run here so a request never blocks on them.
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Opt-in: started only with `docker compose --profile ci up`, so the normal
  # development stack does not pay for a CI server it is not using.
  jenkins:
    # Built rather than pulled: the official image has no docker client, and
    # every pipeline stage shells out to docker compose.
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    profiles: ["ci"]
    user: root
    environment:
      # runSetupWizard=false skips the setup wizard: the pipeline is defined by
      # the Jenkinsfile in this repository, so there is nothing to configure
      # through the UI.
      #
      # ALLOW_LOCAL_CHECKOUT lets the job build from /workspace, the read-only
      # mount of this repository. Jenkins refuses local-path checkouts by
      # default because on a shared server any job could then read any path the
      # controller can. That reasoning does not apply to a single-user CI
      # server on your own machine — but do not carry this flag to a shared one.
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    ports:
      - "${JENKINS_PORT:-8080}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Jenkins builds this project with docker compose, so it needs the host
      # daemon. This grants the container root-equivalent access to the host
      # and is acceptable only for a local CI server you control.
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro

volumes:
  postgres_data:
  jenkins_home:
